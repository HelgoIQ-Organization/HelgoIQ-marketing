<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>HelgoIQ — The Intelligent Platform for Modern Fitness Businesses</title>
    <meta name="description" content="HelgoIQ brings booking, member management, CRM, marketing automation, and AI intelligence into one calm platform. Named for Helgoland — where quantum mechanics began." />
    <meta name="keywords" content="fitness studio software, gym management software, boutique fitness booking, studio CRM, member retention, AI fitness platform, class scheduling software" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://helgoiq.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://helgoiq.com/" />
    <meta property="og:title" content="HelgoIQ — The Intelligent Platform for Modern Fitness Businesses" />
    <meta property="og:description" content="Booking, member management, CRM, marketing automation, and AI intelligence in one platform. Start free — no card required." />
    <meta property="og:image" content="https://helgoiq.com/images/helgoland-hero.webp" />
    <meta property="og:site_name" content="HelgoIQ" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@helgoiq" />
    <meta name="twitter:title" content="HelgoIQ — The Intelligent Platform for Modern Fitness Businesses" />
    <meta name="twitter:description" content="Booking, member management, CRM, marketing automation, and AI intelligence in one platform." />
    <meta name="twitter:image" content="https://helgoiq.com/images/helgoland-hero.webp" />

    <!-- Structured Data — Organisation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "HelgoIQ",
      "url": "https://helgoiq.com",
      "logo": "https://helgoiq.com/logo.png",
      "description": "The intelligent platform for modern fitness businesses. Booking, CRM, marketing automation, and AI intelligence in one platform.",
      "sameAs": []
    }
    </script>

    <!-- Structured Data — SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "HelgoIQ",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": [
        {
          "@type": "Offer",
          "name": "Core",
          "price": "0",
          "priceCurrency": "GBP",
          "description": "Full booking, member management, payments, and CRM"
        },
        {
          "@type": "Offer",
          "name": "Growth",
          "price": "149",
          "priceCurrency": "GBP",
          "description": "Analytics, marketing automation, and advanced CRM"
        },
        {
          "@type": "Offer",
          "name": "Premium",
          "price": "249",
          "priceCurrency": "GBP",
          "description": "Full AI suite, advanced automation, and enterprise reporting"
        }
      ]
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Google Search Console verification placeholder -->
    <!-- <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" /> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
